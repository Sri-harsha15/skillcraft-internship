<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced To-Do App</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(-45deg,#e0f7fa,#fce4ec,#fff3e0,#e3f2fd);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
}

@keyframes bg {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.app {
  width: 450px;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  border: 1px solid #ddd;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: linear-gradient(45deg,#ff512f,#dd2476);
  color: white;
}

/* TASK */
.task {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  background: white;

  cursor: grab;
}

.task.dragging {
  opacity: 0.5;
}

/* PRIORITY COLORS */
.high { border-left: 5px solid red; }
.medium { border-left: 5px solid orange; }
.low { border-left: 5px solid green; }

.completed {
  text-decoration: line-through;
  opacity: 0.6;
}

/* SMALL TEXT */
.small {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<div class="app">

  <h2>🔥 Advanced To-Do App</h2>

  <input type="text" id="user" placeholder="Login Username">

  <input type="text" id="taskText" placeholder="Enter Task">

  <input type="time" id="taskTime">

  <select id="priority">
    <option value="low">Low Priority</option>
    <option value="medium">Medium Priority</option>
    <option value="high">High Priority</option>
  </select>

  <button onclick="addTask()">Add Task</button>

  <div id="list"></div>

</div>

<script>

let tasks = [];
let currentUser = "";

/* LOGIN STYLE STORAGE */
function loadUser(){
  currentUser = document.getElementById("user").value;
  tasks = JSON.parse(localStorage.getItem(currentUser)) || [];
}

/* SAVE */
function save(){
  localStorage.setItem(currentUser, JSON.stringify(tasks));
}

/* ADD TASK */
function addTask(){

  loadUser();

  let text = document.getElementById("taskText").value;
  let time = document.getElementById("taskTime").value;
  let priority = document.getElementById("priority").value;

  if(!text || !currentUser){
    alert("Enter user & task");
    return;
  }

  tasks.push({
    id: Date.now(),
    text,
    time,
    priority,
    completed:false
  });

  save();
  render();
}

/* RENDER */
function render(){

  let list = document.getElementById("list");
  list.innerHTML = "";

  tasks.forEach((t,index)=>{

    list.innerHTML += `
      <div class="task ${t.priority} ${t.completed?'completed':''}" 
           draggable="true"
           ondragstart="drag(event,${index})"
           ondrop="drop(event,${index})"
           ondragover="allowDrop(event)">

        <div>
          <b>${t.text}</b><br>
          <span class="small">⏰ ${t.time || "No time"}</span><br>
          <span class="small">Priority: ${t.priority}</span>
        </div>

        <div>
          <button onclick="toggle(${t.id})">✔</button>
          <button onclick="del(${t.id})">🗑</button>
        </div>

      </div>
    `;
  });
}

/* COMPLETE */
function toggle(id){
  tasks = tasks.map(t=>{
    if(t.id===id) t.completed=!t.completed;
    return t;
  });
  save();
  render();
}

/* DELETE */
function del(id){
  tasks = tasks.filter(t=>t.id!==id);
  save();
  render();
}

/* DRAG START */
let dragIndex;

function drag(ev,index){
  dragIndex=index;
}

/* DROP */
function allowDrop(ev){
  ev.preventDefault();
}

function drop(ev,index){
  ev.preventDefault();

  let temp = tasks[dragIndex];
  tasks.splice(dragIndex,1);
  tasks.splice(index,0,temp);

  save();
  render();
}

/* NOTIFICATION CHECK */
setInterval(()=>{

  let now = new Date();
  let hh = String(now.getHours()).padStart(2,'0');
  let mm = String(now.getMinutes()).padStart(2,'0');

  let currentTime = `${hh}:${mm}`;

  tasks.forEach(t=>{
    if(t.time === currentTime && !t.completed){
      alert("⏰ Reminder: " + t.text);
    }
  });

},60000);

render();

</script>

</body>
</html>
