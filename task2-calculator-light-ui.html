<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Calculator</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

/* 🌤 LIGHT BACKGROUND */
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background: linear-gradient(135deg,#e0f7fa,#f1f8ff,#fce4ec,#fff3e0);
}

/* CALCULATOR BOX */
.calculator {
  width: 320px;
  padding: 20px;
  border-radius: 18px;

  background: #ffffff;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* DISPLAY */
.display {
  width: 100%;
  height: 60px;
  font-size: 24px;
  text-align: right;

  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  margin-bottom: 15px;

  background: #f9fafb;
}

/* BUTTON GRID */
.buttons {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
}

/* BUTTONS */
button {
  padding: 15px;
  font-size: 18px;

  border: none;
  border-radius: 10px;
  cursor: pointer;

  background: #f3f4f6;
  transition: 0.2s;
}

button:hover {
  background: #e5e7eb;
  transform: scale(1.05);
}

/* SPECIAL BUTTONS */
.operator {
  background: #dbeafe;
  color: #1d4ed8;
}

.equal {
  background: #60a5fa;
  color: white;
}

.clear {
  background: #fecaca;
  color: #b91c1c;
}
</style>
</head>

<body>

<div class="calculator">

  <input type="text" id="display" class="display" placeholder="0" readonly>

  <div class="buttons">

    <button onclick="clearDisplay()" class="clear">C</button>
    <button onclick="append('%')" class="operator">%</button>
    <button onclick="backspace()">⌫</button>
    <button onclick="append('/')" class="operator">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('*')" class="operator">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('-')" class="operator">-</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('+')" class="operator">+</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button onclick="calculate()" class="equal" style="grid-column: span 2;">=</button>

  </div>

</div>

<script>

let display = document.getElementById("display");

function append(value){
  display.value += value;
}

function clearDisplay(){
  display.value = "";
}

function backspace(){
  display.value = display.value.slice(0,-1);
}

function calculate(){
  try{
    display.value = eval(display.value);
  } catch {
    display.value = "Error";
  }
}

/* KEYBOARD SUPPORT */
document.addEventListener("keydown",(e)=>{

  if(!isNaN(e.key) || "+-*/.%".includes(e.key)){
    append(e.key);
  }

  if(e.key === "Enter"){
    calculate();
  }

  if(e.key === "Backspace"){
    backspace();
  }

  if(e.key === "Escape"){
    clearDisplay();
  }
});

</script>

</body>
</html>
