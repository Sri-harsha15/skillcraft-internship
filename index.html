<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multicolor Navbar</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
  scroll-behavior: smooth;
}

/* BODY */
body {
  background: #0f172a;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 15px 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;

  background: linear-gradient(90deg, #ff416c, #ff4b2b, #1fa2ff, #a044ff);
  background-size: 300% 300%;
  animation: gradientMove 6s ease infinite;

  transition: all 0.4s ease;
  z-index: 1000;
}

/* ANIMATION */
@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* SCROLLED NAV */
nav.scrolled {
  background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}

/* LOGO */
.logo {
  font-size: 22px;
  font-weight: bold;
  color: white;
}

/* MENU */
ul {
  list-style: none;
  display: flex;
  gap: 25px;
}

ul li a {
  text-decoration: none;
  color: white;
  font-size: 16px;
  padding: 8px 14px;
  border-radius: 20px;
  transition: all 0.3s ease;
}

/* HOVER */
ul li a:hover {
  background: linear-gradient(45deg, #00f260, #0575e6, #ff00cc);
  transform: scale(1.1);
  box-shadow: 0 0 15px rgba(255,255,255,0.6);
}

/* SCROLLED HOVER */
nav.scrolled ul li a:hover {
  background: linear-gradient(45deg, #ffcc00, #ff6600);
}

/* SECTIONS */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 45px;
  color: white;
}

/* DIFFERENT BACKGROUNDS */
#home { background: #1e1e2f; }
#about { background: #16213e; }
#services { background: #0f3460; }
#contact { background: #53354a; }
#button { background: #111827; }

/* BUTTON STYLE INSIDE SECTION */
.cta-btn {
  padding: 12px 25px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  color: white;
  background: linear-gradient(45deg, #ff512f, #dd2476);
  transition: 0.3s;
}

.cta-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px rgba(255,0,100,0.6);
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="logo">🌈 MySite</div>
  <ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#services">Services</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<!-- SECTIONS -->
<section id="home">🏠 Home Section</section>
<section id="about">👤 About Section</section>
<section id="services">⚙ Services Section</section>
<section id="contact">📞 Contact Section</section>

<!-- BUTTON SECTION -->
<section id="button">
  <button class="cta-btn">🚀 Get Started</button>
</section>

<!-- SCRIPT -->
<script>
const navbar = document.getElementById("navbar");

window.addEventListener("scroll", () => {
  if (window.scrollY > 50) {
    navbar.classList.add("scrolled");
  } else {
    navbar.classList.remove("scrolled");
  }
});
</script>

</body>
</html>
