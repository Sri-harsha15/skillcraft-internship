<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillCraft Internship Dashboard</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
  color: white;
  min-height: 100vh;
}

/* HEADER */
header {
  text-align: center;
  padding: 60px 20px 30px;
}

header h1 {
  font-size: 36px;
  background: linear-gradient(90deg,#ff512f,#dd2476,#1fa2ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

header p {
  opacity: 0.8;
  margin-top: 10px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 40px;
  max-width: 1000px;
  margin: auto;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 15px;
  padding: 25px;
  text-align: center;
  backdrop-filter: blur(10px);
  transition: 0.3s ease;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  background: rgba(255,255,255,0.12);
}

/* ICON */
.card span {
  font-size: 40px;
  display: block;
  margin-bottom: 10px;
}

/* LINK BUTTON */
.card a {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 15px;
  text-decoration: none;
  color: white;
  border-radius: 8px;
  background: linear-gradient(45deg,#ff512f,#dd2476);
  transition: 0.3s;
}

.card a:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(255,255,255,0.2);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  opacity: 0.6;
}
</style>

</head>

<body>

<header>
  <h1>🚀 SkillCraft Internship Dashboard</h1>
  <p>Modern Project Collection | Click to Open Apps</p>
</header>

<div class="container">

  <div class="card">
    <span>🧮</span>
    <h3>Calculator</h3>
    <a href="task2-calculator-light-ui.html" target="_blank">Open</a>
  </div>

  <div class="card">
    <span>⏱</span>
    <h3>Stopwatch</h3>
    <a href="task2-stopwatch-index.html" target="_blank">Open</a>
  </div>

  <div class="card">
    <span>❓</span>
    <h3>Quiz App</h3>
    <a href="task3-quiz-app.html" target="_blank">Open</a>
  </div>

  <div class="card">
    <span>🎮</span>
    <h3>Tic Tac Toe</h3>
    <a href="task3-tic-tac-toe-ai-game.html" target="_blank">Open</a>
  </div>

  <div class="card">
    <span>📝</span>
    <h3>Todo App</h3>
    <a href="task4-todo-advanced-app.html" target="_blank">Open</a>
  </div>

</div>

<footer>
  © 2026 SkillCraft Internship Project | Built by You 🚀
</footer>

</body>
</html>
