<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillCraft Internship Dashboard</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: linear-gradient(135deg, #f8fafc, #e0f2fe, #fdf2f8);
  color: #1f2937;
  min-height: 100vh;
}

/* HEADER */
header {
  text-align: center;
  padding: 60px 20px 30px;
}

header h1 {
  font-size: 36px;
  background: linear-gradient(90deg,#2563eb,#ec4899,#f97316);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

header p {
  margin-top: 10px;
  opacity: 0.7;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 40px;
  max-width: 1000px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  border-radius: 16px;
  padding: 25px;
  text-align: center;
  border: 1px solid #e5e7eb;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  transition: 0.3s ease;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}

/* ICON */
.card span {
  font-size: 40px;
  display: block;
  margin-bottom: 10px;
}

/* TITLE */
.card h3 {
  margin-bottom: 10px;
}

/* BUTTON */
.card a {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 15px;
  text-decoration: none;
  color: white;
  border-radius: 8px;
  background: linear-gradient(45deg,#3b82f6,#ec4899);
  transition: 0.3s;
}

.card a:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  opacity: 0.6;
  margin-top: 30px;
}
</style>

</head>

<body>

<header>
  <h1>🚀 SkillCraft Internship Dashboard</h1>
  <p>Clean Light UI | Click to Open Projects</p>
</header>

<div class="container">

  <div class="card">
    <span>🧮</span>
    <h3>Calculator</h3>
    <a href="task2-calculator-light-ui.html" target="_blank">Open</a>
  </div>

  <div class="card">
    <span>⏱</span>
    <h3>Stopwatch</h3>
    <a href="task2-stopwatch-index.html" target="_blank">Open</a>
  </div>

  <div class="card">
    <span>❓</span>
    <h3>Quiz App</h3>
    <a href="task3-quiz-app.html" target="_blank">Open</a>
  </div>

  <div class="card">
    <span>🎮</span>
    <h3>Tic Tac Toe</h3>
    <a href="task3-tic-tac-toe-ai-game.html" target="_blank">Open</a>
  </div>

  <div class="card">
    <span>📝</span>
    <h3>Todo App</h3>
    <a href="task4-todo-advanced-app.html" target="_blank">Open</a>
  </div>

</div>

<footer>
  © 2026 SkillCraft Internship Project | Built by You 🚀
</footer>

</body>
</html>
