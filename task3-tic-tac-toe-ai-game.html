<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe AI + Confetti</title>

<!-- 🎉 CONFETTI LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

/* BACKGROUND */
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background: linear-gradient(-45deg,#ff9a9e,#fad0c4,#a18cd1,#fbc2eb);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
}

@keyframes bg {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* GAME BOX */
.game {
  text-align: center;
  padding: 20px;
  border-radius: 18px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* SCOREBOARD */
.scoreboard {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 15px 0;
}

.score-card {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  background: white;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.score-card:hover {
  transform: translateY(-5px);
}

.score-card h3 {
  font-size: 14px;
}

.score-card p {
  font-size: 22px;
  font-weight: bold;
}

.player { border-top: 4px solid #3b82f6; }
.ai { border-top: 4px solid #ef4444; }
.draw { border-top: 4px solid #10b981; }

/* BOARD */
.board {
  display: grid;
  grid-template-columns: repeat(3, 90px);
  gap: 10px;
  justify-content: center;
}

.cell {
  width: 90px;
  height: 90px;
  background: white;
  border-radius: 12px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.cell:hover {
  transform: scale(1.05);
}

/* WIN HIGHLIGHT */
.win {
  background: #4ade80 !important;
  color: white;
}

/* BUTTON */
button {
  margin-top: 15px;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  cursor: pointer;

  background: linear-gradient(45deg,#ff512f,#dd2476);
  color: white;
}
</style>
</head>

<body>

<div class="game">

  <h1>🎮 Tic Tac Toe AI</h1>

  <!-- SCOREBOARD -->
  <div class="scoreboard">
    <div class="score-card player">
      <h3>🧑 Player</h3>
      <p id="ps">0</p>
    </div>

    <div class="score-card ai">
      <h3>🤖 AI</h3>
      <p id="as">0</p>
    </div>

    <div class="score-card draw">
      <h3>🤝 Draw</h3>
      <p id="ds">0</p>
    </div>
  </div>

  <div class="board" id="board"></div>

  <button onclick="reset()">Restart</button>

</div>

<!-- SOUND -->
<audio id="clickSound" src="https://www.soundjay.com/button/beep-07.wav"></audio>
<audio id="winSound" src="https://www.soundjay.com/misc/success-bell.wav"></audio>

<script>

let board = ["","","","","","","","",""];
let player = "X";
let ai = "O";
let active = true;

let ps = 0, as = 0, ds = 0;

const winPatterns = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

/* 🎉 CONFETTI */
function celebrateWin() {
  const duration = 1500;
  const end = Date.now() + duration;

  (function frame() {
    confetti({
      particleCount: 6,
      spread: 70,
      startVelocity: 35,
      origin: { x: Math.random(), y: Math.random() - 0.2 }
    });

    if (Date.now() < end) {
      requestAnimationFrame(frame);
    }
  })();
}

/* DRAW BOARD */
function draw(){
  let b = document.getElementById("board");
  b.innerHTML = "";

  board.forEach((val,i)=>{
    let div = document.createElement("div");
    div.classList.add("cell");
    div.innerText = val;
    div.onclick = ()=>play(i);
    b.appendChild(div);
  });
}

/* PLAY */
function play(i){

  if(board[i] !== "" || !active) return;

  document.getElementById("clickSound").play();

  board[i] = player;

  if(checkWin(player)){
    ps++;
    updateScore();
    return;
  }

  if(!board.includes("")){
    ds++;
    updateScore();
    alert("Draw!");
    resetBoard();
    return;
  }

  aiMove();
  draw();
}

/* AI MOVE */
function aiMove(){

  let empty = board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
  let move = empty[Math.floor(Math.random()*empty.length)];

  board[move] = ai;

  if(checkWin(ai)){
    as++;
    updateScore();
  }

  if(!board.includes("")){
    ds++;
    updateScore();
    alert("Draw!");
    resetBoard();
  }
}

/* CHECK WIN */
function checkWin(p){

  for(let pattern of winPatterns){
    let [a,b,c] = pattern;

    if(board[a]===p && board[b]===p && board[c]===p){

      highlight(pattern);

      document.getElementById("winSound").play();
      celebrateWin();

      setTimeout(()=>{
        alert(p + " Wins!");
        resetBoard();
      },300);

      return true;
    }
  }

  return false;
}

/* HIGHLIGHT WIN LINE */
function highlight(pattern){

  setTimeout(()=>{
    let cells = document.querySelectorAll(".cell");
    pattern.forEach(i=>{
      cells[i].classList.add("win");
    });
  },100);
}

/* SCORE */
function updateScore(){
  document.getElementById("ps").innerText = ps;
  document.getElementById("as").innerText = as;
  document.getElementById("ds").innerText = ds;
}

/* RESET */
function reset(){
  ps = 0;
  as = 0;
  ds = 0;
  updateScore();
  resetBoard();
}

function resetBoard(){
  board = ["","","","","","","","",""];
  active = true;
  draw();
}

/* INIT */
draw();

</script>

</body>
</html>
